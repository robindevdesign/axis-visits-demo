<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#b6d436" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Axis Visits" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Axis Visits — Visit operations</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="axis-visits-icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=12" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebarMenu">
      <div class="sidebar-head">
        <a class="brand" href="#" data-action="home" aria-label="Axis Visits home">
          <img class="brand-logo" src="axis-logo-black.svg" alt="Axis Lighting" />
          <span class="brand-divider"></span>
          <span class="brand-product">VISITS</span>
        </a>
        <button class="sidebar-close" type="button" data-action="close-menu" aria-label="Close navigation">×</button>
      </div>

      <div class="workspace-label">WORKSPACE</div>
      <nav class="side-nav" aria-label="Main navigation">
        <button class="nav-link active" data-action="home" data-nav-page="overview"><span class="nav-icon">⌂</span>Overview</button>
        <button class="nav-link" data-action="all-visits" data-nav-page="all-visits"><span class="nav-icon">▤</span>All visits <span class="nav-count" id="navVisitCount">—</span></button>
        <button class="nav-link" data-action="needs-review" data-nav-page="needs-review"><span class="nav-icon review-icon">◉</span>Needs review <span class="nav-count alert-count" id="navReviewCount">—</span></button>
        <button class="nav-link" data-action="archives" data-nav-page="archives"><span class="nav-icon">▣</span>Archived</button>
        <button class="nav-link mobile-settings-link" data-action="settings" data-nav-page="settings"><span class="nav-icon">⚙</span>Settings</button>
      </nav>

      <div class="sidebar-section-label">YOUR SPACE</div>
      <div class="space-card">
        <div class="space-glyph">A</div>
        <div><strong>Axis Lighting</strong><span>Internal workspace</span></div>
        <span class="chevron">⌄</span>
      </div>

      <div class="sidebar-bottom">
        <div class="lighting-note"><span class="note-light"></span><div><b>Every visit, in sync.</b><small>People, plans and details<br>in one place.</small></div></div>
        <button class="nav-link settings-link" data-action="settings" data-nav-page="settings"><span class="nav-icon">⚙</span>Workspace settings</button>
        <div class="profile-block">
          <div class="avatar avatar-monse">MJ</div><div class="profile-copy"><strong>Monserrat Jimenez</strong><span>Marketing · Super Admin</span></div><button class="profile-menu" aria-label="Profile menu">···</button>
        </div>
      </div>
    </aside>
    <button class="mobile-nav-backdrop" type="button" data-action="close-menu" aria-label="Close navigation" hidden></button>

    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu-button" id="mobileMenuButton" type="button" data-action="toggle-menu" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebarMenu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg></button>
        <div class="breadcrumbs"><span>Axis Visits</span><span class="crumb-slash">/</span><strong id="breadcrumbCurrent">Overview</strong></div>
        <div class="topbar-actions">
          <label class="role-switch" title="Switch demo role"><span>View as</span><select id="roleSelect" aria-label="Switch demo role"><option value="SUPER_ADMIN">Monserrat</option><option value="VP">Lead VP</option><option value="SALES">Sales</option></select></label>
          <button class="icon-button" data-action="notifications" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 12h4"/></svg><i id="notificationDot"></i></button>
          <div class="avatar avatar-monse top-avatar">MJ</div>
        </div>
      </header>

      <section id="appContent" class="content-wrap" aria-live="polite"></section>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal-header"><div><p class="eyebrow" id="modalEyebrow">AXIS VISITS</p><h2 id="modalTitle">New visit</h2></div><button class="close-button" data-action="close-modal" aria-label="Close">×</button></header>
      <div id="modalBody" class="modal-body"></div>
      <footer id="modalFooter" class="modal-footer"></footer>
    </section>
  </div>
  <div class="toast-region" id="toastRegion" aria-live="polite"></div>
  <script src="app.js?v=10"></script>
</body>
</html>
